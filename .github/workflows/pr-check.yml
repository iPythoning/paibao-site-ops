# Adapted from VibeDevOps templates/ci/pr-check.yml for a dependency-free JS CLI.
# No TypeScript/transpilation or server deployment: syntax, tests and pack readiness are its gates.
name: PR Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Never run fork code on the persistent builder.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Secret scan with positive control
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --max-time 120 --retry 2 -o "$tmp/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tmp/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$tmp/gitleaks.tgz" -C "$tmp" gitleaks
          mkdir "$tmp/control"
          node -e 'require("node:fs").writeFileSync(process.argv[1], "github_token = ghp_" + require("node:crypto").randomBytes(18).toString("hex"))' "$tmp/control/planted.txt"
          code=0
          "$tmp/gitleaks" dir "$tmp/control" --redact --no-banner --log-level error >/dev/null 2>&1 || code=$?
          test "$code" -eq 1 || { echo 'Secret scanner positive control failed'; exit 1; }
          "$tmp/gitleaks" git --redact --no-banner
      - run: npm run check
      - run: npm test
      - run: npm run test:coverage
      - name: Package readiness (no publish)
        run: npm pack --dry-run
